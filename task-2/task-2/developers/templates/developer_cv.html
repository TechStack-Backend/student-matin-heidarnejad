{% extends "base.html" %}
{% block title %}CV {{ full_name }}{% endblock %}

{% block content %}
  <div class="card">
    <h3 style="margin-top:0">{{ full_name }}</h3>
    <p style="color:#666">username: <b>@{{ dev.username }}</b></p>
    <h4>skill:</h4>
    <ul>
      {% for s in dev.skills %}
        <li>{{ s }}</li>
      {% endfor %}
    </ul>

    <p style="margin-top:12px">
      <a class="btn" href="{% url 'developers:list' %}">back to list</a>
    </p>
  </div>
{% endblock %}
